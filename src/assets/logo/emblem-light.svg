<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" fill="none">

    <defs>
      <linearGradient id="shieldGrad_light" x1="100" y1="10" x2="100" y2="225" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f6faf8" />
        <stop offset="100%" stop-color="#e5eee9" />
      </linearGradient>

      <linearGradient id="greenFlow_light" x1="70" y1="90" x2="170" y2="140" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#39B86A" />
        <stop offset="100%" stop-color="#1B633A" />
      </linearGradient>

      <linearGradient id="earthFlow_light" x1="50" y1="50" x2="160" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#CB7E3A" />
        <stop offset="100%" stop-color="#A85F20" />
      </linearGradient>

      <clipPath id="shieldClip_light">
        <path d="M 68 28 L 118 8 L 168 38 C 178 90 166 162 100 222 C 34 162 22 90 32 38 Z" />
      </clipPath>
    </defs>

    <!-- Outer Heavy-Duty Engineered Shield Frame -->
    <path 
      d="M 68 24 L 118 4 L 170 35 C 180 88 168 165 100 226 C 32 165 20 88 30 35 Z" 
      fill="#26343A" 
      stroke="#0B2F24" 
      stroke-width="3" 
      stroke-linejoin="round"
    />

    <!-- Inner Shield Face with gradient -->
    <path 
      d="M 68 28 L 118 8 L 168 38 C 178 90 166 162 100 222 C 34 162 22 90 32 38 Z" 
      fill="url(#shieldGrad_light)" 
    />

    <!-- Technical Bevel Dash Line -->
    <path 
      d="M 70 34 L 118 14 L 162 43 C 171 90 160 155 100 214 C 40 155 29 90 38 43 Z" 
      stroke="#2F7D4A" 
      stroke-width="1.5" 
      stroke-dasharray="5 2.5" 
      fill="none" 
      opacity="0.85"
    />

    <!-- Clipped Interior Graphics -->
    <g clip-path="url(#shieldClip_light)">

      <!-- Himalayan Peaks -->
      <!-- Secondary Peak -->
      <polygon points="128,34 154,18 180,58 116,58" fill="#3d4d54" />
      <polygon points="154,18 144,30 154,28 164,34 168,26" fill="#F5F7F4" opacity="0.85" />

      <!-- Primary Himalayan Pyramid Summit -->
      <polygon points="118,8 162,72 118,76" fill="#26343A" />
      <polygon points="118,8 118,76 76,70" fill="#0B2F24" />

      <!-- Snow Cap of Main Peak -->
      <path 
        d="M 118 8 
           L 100 36 L 109 32 L 118 42 L 126 34 L 138 42 L 146 33 L 152 48 
           L 118 8 Z" 
        fill="#F5F7F4" 
        stroke="#FFFFFF" 
        stroke-width="1.2"
      />
      <!-- Sharp Ridge Spine -->
      <line x1="118" y1="8" x2="118" y2="76" stroke="#FFFFFF" stroke-width="2.5" />

      <!-- Landslide / Unstable Slope (Left Flank) -->
      <path 
        d="M 28 42 
           L 68 38 
           L 58 64 
           L 74 72 
           L 60 98 
           L 78 110 
           L 54 146 
           L 28 112 
           Z" 
        fill="url(#earthFlow_light)" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linejoin="round"
      />

      <!-- Geological fracture planes -->
      <path d="M 36 52 L 60 50 L 52 66" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <path d="M 44 76 L 70 74 L 58 92" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <path d="M 38 104 L 72 104 L 60 126" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

      <!-- Displaced Rock Debris -->
      <polygon points="64,118 73,122 69,130 61,126" fill="#CB7E3A" stroke="#FFFFFF" stroke-width="1.2" />
      <polygon points="46,134 54,132 51,142 42,139" fill="#A85F20" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- Dynamic Valley Sweeps -->
      <!-- Earth sweep -->
      <path 
        d="M 72 72 
           C 102 66, 134 78, 176 98 
           L 178 114 
           C 128 90, 94 84, 62 90 
           Z" 
        fill="#A85F20" 
        stroke="#FFFFFF" 
        stroke-width="2"
      />

      <!-- Safety Green early warning sweep -->
      <path 
        d="M 60 98 
           C 96 90, 126 104, 176 130 
           L 172 148 
           C 120 118, 88 110, 50 118 
           Z" 
        fill="url(#greenFlow_light)" 
        stroke="#FFFFFF" 
        stroke-width="2"
      />

      <!-- IoT Environmental Monitoring Station (Right Side) -->
      <line x1="152" y1="46" x2="152" y2="104" stroke="#26343A" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Alpine Solar Collector Panel -->
      <polygon points="142,46 162,40 159,51 140,56" fill="#39B86A" stroke="#FFFFFF" stroke-width="1.5" />
      
      <!-- Weatherproof Telemetry Enclosure -->
      <rect x="144" y="68" width="16" height="18" rx="3.5" fill="#182226" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="152" cy="77" r="3" fill="#39B86A" />

      <!-- Wireless Transmission Waves ((( • ))) -->
      <path d="M 162 62 C 168 66, 168 78, 162 82" stroke="#39B86A" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 167 56 C 176 64, 176 84, 167 92" stroke="#39B86A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2.5 2.5" fill="none" />

      <!-- AI Predictive Telemetry Network -->
      <line x1="104" y1="102" x2="120" y2="88" stroke="#2F7D4A" stroke-width="2.5" stroke-linecap="round" />
      <line x1="120" y1="88" x2="136" y2="94" stroke="#2F7D4A" stroke-width="2.5" stroke-linecap="round" />
      <line x1="136" y1="94" x2="144" y2="77" stroke="#2F7D4A" stroke-width="2.5" stroke-dasharray="2 2" stroke-linecap="round" />

      <circle cx="104" cy="102" r="4" fill="#39B86A" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="120" cy="88" r="4.5" fill="#FFFFFF" stroke="#39B86A" stroke-width="2" />
      <circle cx="136" cy="94" r="4" fill="#39B86A" stroke="#FFFFFF" stroke-width="2" />

      <!-- Geotechnical Retaining / Gabion Mesh Foundation -->
      <g transform="translate(68, 140)">
        <polygon points="32,0 62,15 32,28 2,13" fill="#B8D5C7" stroke="#FFFFFF" stroke-width="1.5" />
        <polygon points="2,13 32,28 32,60 2,45" fill="#8CAE9E" stroke="#FFFFFF" stroke-width="1.5" />
        <polygon points="32,28 62,15 62,47 32,60" fill="#6A8E7E" stroke="#FFFFFF" stroke-width="1.5" />
        
        <line x1="17" y1="6.5" x2="47" y2="21.5" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />
        <line x1="17" y1="19.5" x2="47" y2="8.5" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />
        
        <line x1="17" y1="20.5" x2="17" y2="52.5" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />
        <line x1="2" y1="29" x2="32" y2="44" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />

        <line x1="47" y1="21.5" x2="47" y2="53.5" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />
        <line x1="32" y1="44" x2="62" y2="31" stroke="#2F7D4A" stroke-width="1.2" opacity="0.9" />
      </g>

    </g>

    <!-- Apex Telemetry Beacon Jewel -->
    <circle cx="118" cy="8" r="3.5" fill="#39B86A" stroke="#0B2F24" stroke-width="1.5" />
  
</svg>